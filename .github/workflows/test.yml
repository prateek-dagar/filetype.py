# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-matrix
        name: Load Matrix Configuration
        run: |
          MATRIX=$(jq -c . .github/workflows/python-versions.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  release_test:
    needs: setup_matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: ${{ fromJSON(needs.setup_matrix.outputs.matrix).python-version }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip

    - name: Upgrade PIP
      run: python -m pip install --upgrade pip

    - name: Install application
      run: python -m pip install .

    - name: CLI tool check
      run: python -m filetype --help

    - name: Install test framework dependencies
      run: python -m pip install pytest pytest-cov pytest-benchmark py-cpuinfo

    - name: Run tests
      run: python -m pytest --cov=filetype --cov-report=html:coverage/

    - name: HTML coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage_${{ matrix.os }}_${{ matrix.python-version }}
        path: coverage

