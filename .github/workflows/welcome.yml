name: Welcome

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the project! Thank you for opening your first issue here. We will review it as soon as possible. Please make sure you have read our contributing guidelines."
          pr-message: "Welcome to the project! Thank you for opening your first pull request. We will review your changes shortly. Please ensure your tests pass and formatting is correct."
